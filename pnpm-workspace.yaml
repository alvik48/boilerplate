packages:
  - apps/*
  - packages/*
  - templates/*

# Single source of truth for versions used by more than one workspace package.
# Packages reference these with the "catalog:" specifier instead of a literal
# range, so a version is bumped here once rather than in every manifest.
# Dependencies used by only one package stay declared in that package.
catalog:
  # Toolchain. TypeScript is pinned exactly because typescript-eslint declares
  # `typescript: ">=4.8.4 <6.1.0"`; a caret range would silently admit 6.1 and
  # push the lint stack outside its supported peer range.
  typescript: 6.0.3
  eslint: ^10.10.0
  prettier: ^3.9.6
  '@types/node': ^25.6.0

  # React and Next.js
  next: ^16.3.4
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7

  # UI
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  lucide-react: ^1.43.0
  shadcn: ^4.21.0

  # NestJS runtime packages declare peer dependencies on each other, so they are
  # pinned exactly and bumped together. @nestjs/swagger tracks its own line.
  '@nestjs/common': 11.1.26
  '@nestjs/core': 11.1.26
  '@nestjs/swagger': 11.4.4

  # Shared libraries
  zod: 4.5.4
  '@types/mdast': 4.0.4

allowedDeprecatedVersions:
  glob: 7.2.3 || 10.5.0
  inflight: 1.0.6
  node-domexception: 1.0.0

patchedDependencies:
  fumadocs-openapi@11.4.1: patches/fumadocs-openapi@11.4.1.patch
